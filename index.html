<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stowed">
<title>Stowed</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">Stowed</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-select" data-action="select" aria-label="Select items">Select</button>
      <button class="icon-btn" id="btn-settings" data-action="settings" aria-label="Settings">⚙︎</button>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search items, tags, storage…" autocomplete="off">
  </div>
  <nav class="views" id="views"></nav>
</header>

<div id="banner"></div>
<main id="app"></main>

<div id="selectbar" class="selectbar hidden"></div>
<button id="fab" class="fab" data-action="fab" aria-label="Add items">+</button>

<div id="sheet-root" class="sheet-root hidden">
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true"><div id="sheet-body"></div></div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="drag-ghost" class="drag-ghost hidden"></div>

<script src="app.js"></script>
</body>
</html>
